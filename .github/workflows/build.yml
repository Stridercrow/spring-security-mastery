name: build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - run: |
          for p in 01-basic-web-security 02-jwt-stateless-api 03-oauth2-social-login 04-oauth2-resource-server 05-method-security 06-production-ready; do
            mvn -q -f "$p/pom.xml" test
          done
